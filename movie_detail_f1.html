<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1：狂飙飞车 - 洞悉影视</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            z-index: 1000;
        }

        .logo {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: #00ffaa;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: #00ffaa;
        }

        .register-btn {
            background-color: #00ffaa;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .register-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.5);
        }

        .user-profile {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffaa, #00cc99);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .user-avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.5);
        }

        .user-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            background-color: rgba(0, 0, 0, 0.95);
            border: 1px solid #00ffaa;
            border-radius: 10px;
            padding: 10px 0;
            min-width: 180px;
            box-shadow: 0 5px 20px rgba(0, 255, 170, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 999;
        }

        .user-profile:hover .user-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-menu::before {
            content: '';
            position: absolute;
            top: -8px;
            right: 15px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 8px solid #00ffaa;
        }

        .user-menu-item {
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }

        .user-menu-item:hover {
            background-color: rgba(0, 255, 170, 0.1);
            color: #00ffaa;
        }

        .main-content {
            padding-top: 100px;
            padding-bottom: 50px;
        }

        .movie-header {
            display: flex;
            gap: 40px;
            padding: 0 50px;
            margin-bottom: 40px;
        }

        .movie-poster {
            width: 300px;
            height: 450px;
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            flex-shrink: 0;
        }

        .movie-info {
            flex: 1;
        }

        .movie-title {
            font-size: 36px;
            font-weight: bold;
            color: #00ffaa;
            margin-bottom: 10px;
        }

        .movie-english-title {
            font-size: 18px;
            color: #888;
            margin-bottom: 20px;
        }

        .movie-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: #aaa;
        }

        .movie-genres {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .genre-tag {
            background-color: rgba(0, 255, 170, 0.2);
            color: #00ffaa;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .rating-score {
            font-size: 48px;
            font-weight: bold;
            color: #00ffaa;
        }

        .rating-source {
            color: #888;
            font-size: 14px;
        }

        .movie-synopsis {
            margin-bottom: 30px;
        }

        .synopsis-title {
            font-size: 20px;
            font-weight: bold;
            color: #00ffaa;
            margin-bottom: 15px;
        }

        .synopsis-text {
            line-height: 1.8;
            color: #ccc;
        }

        .favorite-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(0, 255, 170, 0.2);
            color: #00ffaa;
            border: 1px solid #00ffaa;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .favorite-btn:hover {
            background-color: #00ffaa;
            color: #000;
            transform: scale(1.05);
        }

        .favorite-btn.favorited {
            background-color: #00ffaa;
            color: #000;
        }

        .movie-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(0, 255, 170, 0.2);
            color: #00ffaa;
            border: 1px solid #00ffaa;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            margin-bottom: 30px;
            margin-left: 50px;
        }

        .back-btn:hover {
            background-color: #00ffaa;
            color: #000;
        }

        .content-section {
            padding: 0 50px;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            color: #00ffaa;
            margin-bottom: 20px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .media-item {
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            height: 200px;
        }

        .media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 10px;
            font-size: 14px;
            color: #fff;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 10px 20px;
            }

            .logo-text {
                font-size: 18px;
            }

            .movie-header {
                flex-direction: column;
                padding: 0 20px;
            }

            .movie-poster {
                width: 100%;
                height: 400px;
            }

            .movie-info {
                padding: 0;
            }

            .back-btn {
                margin-left: 20px;
            }

            .content-section {
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="movie-header">
            <div class="movie-poster" style="background-image: url('C:\Users\19256\Desktop\设艺\作业\用户体验设计\网页\素材\p2921935298.webp');"></div>
            <div class="movie-info">
                <h1 class="movie-title">F1：狂飙飞车</h1>
                <p class="movie-english-title">F1: The Movie</p>
                
                <div class="movie-meta">
                    <span>2025</span>
                    <span>美国</span>
                    <span>动作/冒险/运动</span>
                </div>

                <div class="movie-genres">
                    <span class="genre-tag">动作</span>
                    <span class="genre-tag">冒险</span>
                    <span class="genre-tag">运动</span>
                </div>

                <div class="movie-rating">
                    <span class="rating-score">5.0</span>
                    <span class="rating-source">豆瓣评分</span>
                </div>

                <div class="movie-synopsis">
                    <div class="synopsis-title">剧情简介</div>
                    <p class="synopsis-text">
                        基尼·海耶斯（布拉德·皮特饰）曾是F1赛场上最具潜力的天才新星，但一场意外葬送了他的职业生涯。三十年后的如今，他作为过气但激情不减的F1车队老板，试图证明自己仍未过时。
                    </p>
                </div>
                
                <div class="movie-actions">
                    <button class="favorite-btn" onclick="toggleFavorite()">
                        <span class="favorite-icon">⭐</span>

                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="movies_data.js"></script>
    <script>
        const MOVIE_ID = 'f1';
        let isFavorited = false;
        
        function initFavorite() {
            const saved = localStorage.getItem('favorite_' + MOVIE_ID);
            isFavorited = saved === 'true';
            
            const btn = document.querySelector('.favorite-btn');
            const text = document.querySelector('.favorite-text');
            
            if (isFavorited) {
                btn.classList.add('favorited');
                text.textContent = '已收藏';
            } else {
                btn.classList.remove('favorited');
                text.textContent = '加入收藏';
            }
        }
        
        function toggleFavorite() {
            isFavorited = !isFavorited;
            const btn = document.querySelector('.favorite-btn');
            const text = document.querySelector('.favorite-text');
            
            localStorage.setItem('favorite_' + MOVIE_ID, isFavorited);
            
            if (isFavorited) {
                btn.classList.add('favorited');
                text.textContent = '已收藏';
                alert('已添加到收藏！');
            } else {
                btn.classList.remove('favorited');
                text.textContent = '加入收藏';
                alert('已取消收藏！');
            }
        }
        
        function syncFavoriteStatus() {
            const saved = localStorage.getItem('favorite_' + MOVIE_ID);
            const currentStatus = saved === 'true';
            
            if (currentStatus !== isFavorited) {
                isFavorited = currentStatus;
                const btn = document.querySelector('.favorite-btn');
                const text = document.querySelector('.favorite-text');
                
                if (isFavorited) {
                    btn.classList.add('favorited');
                    text.textContent = '已收藏';
                } else {
                    btn.classList.remove('favorited');
                    text.textContent = '加入收藏';
                }
            }
        }
        
        document.addEventListener('DOMContentLoaded', initFavorite);
        window.addEventListener('storage', syncFavoriteStatus);
    </script>
