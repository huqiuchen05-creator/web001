<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 洞悉影视</title>
    <link rel="icon" href="picture/123.jpg" type="image/jpeg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }
        
        /* 顶部导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 50px;
            z-index: 1000;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo img {
            width: 40px;
            height: 40px;
        }
        
        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .nav-link {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            color: #00ffaa;
        }
        
        .nav-link:not(:last-child)::after {
            content: "|";
            margin-left: 20px;
            color: #fff;
        }
        
        .logo {
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            transform: scale(1.05);
        }
        
        .logo img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }
        
        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: #00ffaa;
        }
        
        .register-btn {
            background-color: #00ffaa;
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .register-btn:hover {
            transform: scale(1.05);
        }

        /* 用户头像和下拉菜单 */
        .user-profile {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ffaa, #00cc99);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .user-avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.5);
        }

        .user-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 10px;
            background-color: rgba(0, 0, 0, 0.95);
            border: 1px solid #00ffaa;
            border-radius: 10px;
            padding: 10px 0;
            min-width: 180px;
            box-shadow: 0 5px 20px rgba(0, 255, 170, 0.2);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 999;
        }

        .user-profile:hover .user-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .user-menu::before {
            content: '';
            position: absolute;
            top: -8px;
            right: 15px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 8px solid #00ffaa;
        }

        .user-menu-item {
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }

        .user-menu-item:hover {
            background-color: rgba(0, 255, 170, 0.1);
            color: #00ffaa;
        }

        .user-menu-item i {
            margin-right: 10px;
            font-size: 14px;
        }

        /* 主体内容区 */
        .main-content {
            margin-top: 80px;
            padding: 40px 50px;
        }
        
        /* 页面标题 */
        .page-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #00ffaa;
        }
        
        /* 历史记录内容 */
        .history-content {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 30px;
        }
        
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .history-count {
            font-size: 14px;
            color: #aaa;
        }
        
        .clear-history-btn {
            background-color: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .clear-history-btn:hover {
            background-color: #ff4444;
            color: #fff;
        }
        
        .history-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border-bottom: 1px solid rgba(0, 255, 170, 0.2);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .history-item:hover {
            background-color: rgba(0, 255, 170, 0.05);
            border-radius: 8px;
        }
        
        .history-item:last-child {
            border-bottom: none;
        }
        
        .history-item.removing {
            animation: slideOut 0.3s ease-out forwards;
        }
        
        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(-20px);
            }
        }
        
        .history-poster {
            width: 80px;
            height: 120px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .history-poster:hover {
            transform: scale(1.05);
        }
        
        .history-info {
            flex: 1;
        }
        
        .history-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .history-title:hover {
            color: #00ffaa;
        }
        
        .history-time {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 12px;
        }
        
        .history-progress {
            width: 100%;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .history-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ffaa, #00cc99);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        
        .history-actions {
            display: flex;
            gap: 10px;
        }
        
        .history-btn {
            background-color: rgba(0, 255, 170, 0.2);
            color: #00ffaa;
            border: 1px solid #00ffaa;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 80px;
            text-align: center;
        }
        
        .history-btn:hover {
            background-color: #00ffaa;
            color: #000;
        }
        
        .history-btn.delete {
            background-color: rgba(255, 0, 0, 0.1);
            color: #ff4444;
            border-color: #ff4444;
        }
        
        .history-btn.delete:hover {
            background-color: #ff4444;
            color: #fff;
        }
        
        .history-btn.favorite {
            background-color: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            border-color: #ffd700;
        }
        
        .history-btn.favorite:hover {
            background-color: #ffd700;
            color: #000;
        }
        
        /* 操作提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 10000;
            border: 1px solid #00ffaa;
        }
        
        .toast.show {
            opacity: 1;
            visibility: visible;
        }
        
        .toast.error {
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .toast.success {
            border-color: #00ffaa;
            color: #00ffaa;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 100px 0;
        }
        
        .empty-icon {
            font-size: 60px;
            color: #00ffaa;
            margin-bottom: 20px;
        }
        
        .empty-text {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 10px;
        }
        
        .empty-hint {
            font-size: 14px;
            color: #666;
        }
        
        /* 注册模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .register-modal {
            background-color: #111;
            border: 1px solid #00ffaa;
            border-radius: 15px;
            width: 450px;
            max-width: 90%;
            padding: 40px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.3);
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .modal-close:hover {
            color: #00ffaa;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: bold;
            color: #00ffaa;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-label {
            color: #00ffaa;
            font-size: 14px;
            font-weight: bold;
        }
        
        .form-input {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 170, 0.3);
            border-radius: 8px;
            padding: 14px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #00ffaa;
            box-shadow: 0 0 0 3px rgba(0, 255, 170, 0.2);
        }
        
        .form-input::placeholder {
            color: #666;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 18px;
        }
        
        .password-toggle:hover {
            color: #00ffaa;
        }
        
        .verify-code {
            display: flex;
            gap: 10px;
        }
        
        .verify-code input {
            flex: 1;
        }
        
        .verify-btn {
            background-color: rgba(0, 255, 170, 0.2);
            color: #00ffaa;
            border: 1px solid #00ffaa;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.3s ease;
        }
        
        .verify-btn:hover {
            background-color: #00ffaa;
            color: #000;
        }
        
        .verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .agreement {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 13px;
            color: #aaa;
        }
        
        .agreement input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #00ffaa;
        }
        
        .agreement a {
            color: #00ffaa;
            text-decoration: none;
        }
        
        .agreement a:hover {
            text-decoration: underline;
        }
        
        .submit-btn {
            background-color: #00ffaa;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            background-color: #00e699;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 170, 0.4);
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }
        
        .login-link a {
            color: #00ffaa;
            text-decoration: none;
            font-weight: bold;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .success-message {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }
        
        .success-message.show {
            display: block;
        }
        
        .success-icon {
            font-size: 60px;
            color: #00ffaa;
            margin-bottom: 20px;
        }
        
        .success-text {
            font-size: 18px;
            color: #fff;
            margin-bottom: 10px;
        }
        
        .success-hint {
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="picture/123.jpg" alt="Logo">
            <span class="logo-text">洞悉影视</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">首页</a>
            <a href="template2.html" class="nav-link">栏目</a>
            <a href="declaration.html" class="nav-link">声明</a>
            <a href="contact.html" class="nav-link">联系站长</a>
            <button class="register-btn">注册</button>
            <div class="user-profile">
                <div class="user-avatar">U</div>
                <div class="user-menu">
                    <a href="history.html" class="user-menu-item"><i>📋</i> 历史记录</a>
                    <a href="favorites.html" class="user-menu-item"><i>⭐</i> 我的收藏</a>
                    <a href="account.html" class="user-menu-item"><i>👤</i> 账号信息</a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- 主体内容区 -->
    <div class="main-content">
        <h1 class="page-title">历史记录</h1>
        
        <div class="history-content" id="historyContent">
            <!-- 历史记录头部 -->
            <div class="history-header">
                <span class="history-count">共 <span id="historyCount">0</span> 条观看记录</span>
                <button class="clear-history-btn" id="clearHistoryBtn">清空全部</button>
            </div>
            
            <!-- 历史记录列表 -->
            <div id="historyList">
                <!-- 动态加载 -->
            </div>
        </div>
        
        <!-- 操作提示 -->
        <div class="toast" id="toast"></div>
    </div>
    
    <!-- 注册模态框 -->
    <div class="modal-overlay">
        <div class="register-modal">
            <button class="modal-close">×</button>
            <h2 class="modal-title">注册账号</h2>
            <div class="form-content">
                <form class="modal-form" id="registerForm">
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-input" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-input" placeholder="请输入邮箱地址" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="password" placeholder="请输入密码（8-20位）" required>
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">确认密码</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入密码" required>
                            <button type="button" class="password-toggle">👁️</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">验证码</label>
                        <div class="verify-code">
                            <input type="text" class="form-input" placeholder="请输入验证码" required>
                            <button type="button" class="verify-btn">获取验证码</button>
                        </div>
                    </div>
                    <div class="agreement">
                        <input type="checkbox" id="agree" required>
                        <label for="agree">我已阅读并同意<a href="declaration.html">《用户协议》</a>和<a href="declaration.html">《隐私政策》</a></label>
                    </div>
                    <button type="submit" class="submit-btn">立即注册</button>
                </form>
            </div>
            <div class="success-message">
                <div class="success-icon">✓</div>
                <div class="success-text">注册成功！</div>
                <div class="success-hint">欢迎加入洞悉影视，开始探索精彩影视世界</div>
            </div>
            <div class="login-link">
                已有账号？<a href="#">立即登录</a>
            </div>
        </div>
    </div>
    
    <script src="history_manager.js"></script>
    <script>
        // 注册模态框功能
        const registerBtn = document.querySelector('.register-btn');
        const modalOverlay = document.querySelector('.modal-overlay');
        const modalClose = document.querySelector('.modal-close');
        const registerForm = document.getElementById('registerForm');
        const successMessage = document.querySelector('.success-message');
        const formContent = document.querySelector('.form-content');
        
        registerBtn.addEventListener('click', function() {
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
        
        modalClose.addEventListener('click', function() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            resetForm();
        });
        
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = 'auto';
                resetForm();
            }
        });
        
        function resetForm() {
            registerForm.reset();
            successMessage.classList.remove('show');
            formContent.style.display = 'block';
        }
        
        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            formContent.style.display = 'none';
            successMessage.classList.add('show');
        });
        
        // 密码显示/隐藏切换
        const passwordToggles = document.querySelectorAll('.password-toggle');
        passwordToggles.forEach(toggle => {
            toggle.addEventListener('click', function() {
                const input = this.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    this.textContent = '🙈';
                } else {
                    input.type = 'password';
                    this.textContent = '👁️';
                }
            });
        });
        
        // 验证码倒计时
        const verifyBtn = document.querySelector('.verify-btn');
        verifyBtn.addEventListener('click', function() {
            let countdown = 60;
            this.disabled = true;
            this.textContent = countdown + '秒后重试';
            
            const timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    this.disabled = false;
                    this.textContent = '获取验证码';
                } else {
                    this.textContent = countdown + '秒后重试';
                }
            }, 1000);
        });
        
        // 历史记录交互功能
        const toast = document.getElementById('toast');
        const historyCount = document.getElementById('historyCount');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const historyList = document.getElementById('historyList');
        const historyContent = document.getElementById('historyContent');
        
        // 格式化时间
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        }
        
        // 显示提示消息
        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        // 继续观看电影
        function continueWatch(movieId) {
            const movieName = getMovieNameFromStorage(movieId);
            showToast(`正在播放 ${movieName}...`);
            setTimeout(() => {
                window.location.href = `movie_detail_${movieId}.html`;
            }, 500);
        }
        
        // 跳转到电影详情页
        function watchMovie(movieId) {
            window.location.href = `movie_detail_${movieId}.html`;
        }
        
        // 添加到收藏
        function addToFavorites(movieId, btn) {
            const movieName = getMovieNameFromStorage(movieId);
            const isFavorited = localStorage.getItem('favorite_' + movieId) === 'true';
            
            if (isFavorited) {
                showToast(`${movieName} 已在收藏中`, 'error');
                return;
            }
            
            localStorage.setItem('favorite_' + movieId, 'true');
            btn.textContent = '✓ 已收藏';
            btn.style.backgroundColor = '#ffd700';
            btn.style.color = '#000';
            showToast(`已将 ${movieName} 添加到收藏`);
        }
        
        // 删除单条记录
        function deleteHistory(btn) {
            const historyItem = btn.closest('.history-item');
            const movieId = historyItem.dataset.movie;
            const movieName = getMovieNameFromStorage(movieId);
            
            historyItem.classList.add('removing');
            
            setTimeout(() => {
                HistoryManager.removeHistory(movieId);
                historyItem.remove();
                updateHistoryCount();
                showToast(`已删除 ${movieName} 的观看记录`);
                
                if (document.querySelectorAll('.history-item').length === 0) {
                    showEmptyState();
                }
            }, 300);
        }
        
        // 更新记录数量
        function updateHistoryCount() {
            const count = HistoryManager.getHistoryCount();
            historyCount.textContent = count;
        }
        
        // 清空全部记录
        clearHistoryBtn.addEventListener('click', function() {
            if (confirm('确定要清空所有观看记录吗？')) {
                const items = document.querySelectorAll('.history-item');
                items.forEach(item => item.classList.add('removing'));
                
                setTimeout(() => {
                    HistoryManager.clearHistory();
                    items.forEach(item => item.remove());
                    updateHistoryCount();
                    showEmptyState();
                    showToast('已清空所有观看记录');
                }, 300);
            }
        });
        
        // 显示空状态
        function showEmptyState() {
            historyContent.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <div class="empty-text">暂无观看记录</div>
                    <div class="empty-hint">快去观看精彩电影吧！</div>
                </div>
            `;
        }
        
        // 从存储获取电影名称
        function getMovieNameFromStorage(movieId) {
            const history = HistoryManager.getHistory();
            const movie = history.find(item => item.id === movieId);
            return movie ? movie.title : movieId;
        }
        
        // 渲染历史记录列表
        function renderHistory() {
            const history = HistoryManager.getHistory();
            
            if (history.length === 0) {
                showEmptyState();
                return;
            }
            
            historyList.innerHTML = history.map(item => `
                <div class="history-item" data-movie="${item.id}">
                    <div class="history-poster" style="background-image: url('${item.poster}');" onclick="watchMovie('${item.id}')"></div>
                    <div class="history-info">
                        <h3 class="history-title" onclick="watchMovie('${item.id}')">${item.title}</h3>
                        <p class="history-time">${formatTime(item.timestamp)}</p>
                        <div class="history-progress">
                            <div class="history-progress-bar" style="width: ${item.progress || 0}%;"></div>
                        </div>
                        <div class="history-actions">
                            <button class="history-btn" onclick="continueWatch('${item.id}')">${item.progress >= 100 ? '重新观看' : '继续观看'}</button>
                            <button class="history-btn favorite" onclick="addToFavorites('${item.id}', this)">添加收藏</button>
                            <button class="history-btn delete" onclick="deleteHistory(this)">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            updateHistoryCount();
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            renderHistory();
        });
    </script>
</body>
</html>
